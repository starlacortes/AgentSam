services:
  agentsam:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      AGENTSAM_TOKEN: "${AGENTSAM_TOKEN:?set AGENTSAM_TOKEN in your environment or .env}"
      AGENTSAM_DATA: /data
      AGENTSAM_PORT: 8080
    volumes:
      - agentsam-data:/data
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AGENTSAM_DOMAIN: ${AGENTSAM_DOMAIN:?set AGENTSAM_DOMAIN in your environment or .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agentsam
    networks:
      - internal

volumes:
  agentsam-data:
  caddy-data:
  caddy-config:

networks:
  internal:
