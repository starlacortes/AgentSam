<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16271E"/>
      <stop offset="0.55" stop-color="#0B140F"/>
      <stop offset="1" stop-color="#050907"/>
    </radialGradient>
    <radialGradient id="glowE" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4AD99E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4AD99E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D4B878" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D4B878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sGrad" x1="700" y1="290" x2="320" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F1D898"/>
      <stop offset="0.3" stop-color="#C9A96A"/>
      <stop offset="0.55" stop-color="#5BC8BD"/>
      <stop offset="1" stop-color="#4AD99E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4B878" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#D4B878" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4AD99E" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#94BE9C" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <radialGradient id="gridFade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1024" height="1024" fill="url(#gridFade)"/></mask>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="512" cy="512" r="420" fill="url(#glowE)" opacity="0.35"/>
  <circle cx="720" cy="290" r="260" fill="url(#glowG)" opacity="0.5"/>

  <!-- orbits -->
  <g fill="none" transform="rotate(-28 512 512)">
    <ellipse cx="512" cy="512" rx="400" ry="170" stroke="url(#ring)" stroke-width="5"/>
    <ellipse cx="512" cy="512" rx="330" ry="330" stroke="#94BE9C" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="4 18" stroke-linecap="round"/>
  </g>

  <!-- team links -->
  <g stroke="#7FE0B4" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M512 515 L700 300"/>
    <path d="M512 515 L326 724"/>
    <path d="M512 515 L216 600" stroke-dasharray="2 16"/>
    <path d="M512 515 L808 424" stroke-dasharray="2 16"/>
  </g>

  <!-- the S: a mission flowing through the team -->
  <path id="s" d="M700 300 C 610 214, 326 228, 326 382 C 326 532, 698 494, 698 648 C 698 806, 418 812, 326 724"
        fill="none" stroke="url(#sGrad)" stroke-width="88" stroke-linecap="round" filter="url(#blur24)" opacity="0.75"/>
  <path d="M700 300 C 610 214, 326 228, 326 382 C 326 532, 698 494, 698 648 C 698 806, 418 812, 326 724"
        fill="none" stroke="url(#sGrad)" stroke-width="64" stroke-linecap="round"/>
  <path d="M700 300 C 610 214, 326 228, 326 382 C 326 532, 698 494, 698 648 C 698 806, 418 812, 326 724"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 34"/>

  <!-- agents -->
  <g>
    <!-- coordinator core -->
    <circle cx="512" cy="515" r="120" fill="#4AD99E" opacity="0.45" filter="url(#blur24)"/>
    <circle cx="512" cy="515" r="76" fill="#0A100D" stroke="#7FE0B4" stroke-width="10"/>
    <circle cx="512" cy="515" r="44" fill="#4AD99E"/>
    <circle cx="498" cy="500" r="14" fill="#E9FFF4" opacity="0.85"/>

    <!-- plan (gold) -->
    <circle cx="700" cy="300" r="80" fill="#F1D898" opacity="0.55" filter="url(#blur24)"/>
    <circle cx="700" cy="300" r="54" fill="#0A100D" stroke="#F1D898" stroke-width="10"/>
    <circle cx="700" cy="300" r="26" fill="#F1D898"/>

    <!-- report (emerald) -->
    <circle cx="326" cy="724" r="80" fill="#4AD99E" opacity="0.55" filter="url(#blur24)"/>
    <circle cx="326" cy="724" r="54" fill="#0A100D" stroke="#7FE0B4" stroke-width="10"/>
    <path d="M304 724 l15 15 l28 -30" fill="none" stroke="#7FE0B4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- satellites on the orbit -->
    <circle cx="216" cy="600" r="20" fill="#5BC8BD"/>
    <circle cx="216" cy="600" r="40" fill="#5BC8BD" opacity="0.4" filter="url(#blur8)"/>
    <circle cx="808" cy="424" r="20" fill="#D4B878"/>
    <circle cx="808" cy="424" r="40" fill="#D4B878" opacity="0.4" filter="url(#blur8)"/>
    <circle cx="160" cy="300" r="5" fill="#DCE6DD" opacity="0.6"/>
    <circle cx="860" cy="760" r="6" fill="#DCE6DD" opacity="0.5"/>
    <circle cx="820" cy="170" r="4" fill="#DCE6DD" opacity="0.5"/>
    <circle cx="190" cy="860" r="4" fill="#DCE6DD" opacity="0.4"/>
  </g>

</svg>
