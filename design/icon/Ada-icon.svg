<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ada brand mark: the gold "A" tile used in the web app's top bar and sidebar.
       Full-bleed square so iOS and Android can apply their own mask; the letter stays inside the 80% safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a24"/>
      <stop offset="1" stop-color="#0a1f15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4ad99e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ad99e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="790">
      <stop offset="0" stop-color="#e2c88c"/>
      <stop offset="1" stop-color="#c2a060"/>
    </linearGradient>
    <clipPath id="letter"><rect x="0" y="232" width="1024" height="558"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g fill="none" stroke="url(#gold)" stroke-width="104" stroke-linejoin="miter" stroke-miterlimit="10" clip-path="url(#letter)">
    <path d="M276 840 L512 262 L748 840"/>
    <path d="M360 622 L664 622" stroke-width="84"/>
  </g>
</svg>
