name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    container:
      image: swift:6.4-noble
      # Docker's default seccomp and AppArmor profiles stop bubblewrap from creating namespaces,
      # which would skip every run_program and terminal sandbox test.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Server/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Server/Package.resolved', 'Server/Package.swift', 'AgentSamCore/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Install the OS sandbox and toolchains used by run_program tests
        run: apt-get update && apt-get install -y --no-install-recommends bubblewrap python3
      - name: Build and test
        working-directory: Server
        run: swift test
      - name: Engine tests (includes the run_program and terminal sandbox tests)
        timeout-minutes: 20
        working-directory: AgentSamCore
        run: swift test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Railway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: agentsam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
